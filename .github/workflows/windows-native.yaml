name: Build FlClash DNS2 Windows client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns2-native-windows
  cancel-in-progress: false

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global url.https://github.com/.insteadOf git@github.com:
      - uses: actions/checkout@v4
      - name: Checkout fixed public upstream source
        uses: actions/checkout@v4
        with:
          repository: chen08209/FlClash
          ref: 7fd417fb9a9a277c6a9339a8ac87f907df7c25f7
          submodules: recursive
          path: source/FlClash-DNS
      - name: Integrate and verify DNS2 complete source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source/FlClash-DNS'
          Get-ChildItem source-overrides -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $source -Recurse -Force
          }
          $manifest = Get-Content build/source-manifest.json -Raw | ConvertFrom-Json
          $mihomo = (& git -C (Join-Path $source 'core/Clash.Meta') rev-parse HEAD).Trim()
          if ($mihomo -ne $manifest.mihomo_commit) { throw 'Unexpected Mihomo source revision.' }
          foreach ($file in $manifest.source_files) {
            $path = Join-Path $source $file.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw ('Missing source: ' + $file.path) }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) {
              throw ('Integrated source SHA256 mismatch: ' + $file.path)
            }
          }
          Write-Host ('Verified integrated source files: ' + $manifest.source_files.Count)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: source/FlClash-DNS/core/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Native build and tests
        shell: pwsh
        run: ./source/FlClash-DNS/tool/build_dns_windows.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/delivery"
      - name: Verify complete runnable client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem delivery -File -Filter '*windows*amd64*.zip')
          if ($packages.Count -ne 1) { throw 'Expected one native Windows client ZIP.' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'dns2-client-verification'
          Expand-Archive -LiteralPath $packages[0].FullName -DestinationPath $unpacked
          $apps = @(Get-ChildItem $unpacked -Recurse -File -Filter FlClash.exe)
          if ($apps.Count -ne 1) { throw 'The client ZIP must contain exactly one FlClash.exe.' }
          $bundle = $apps[0].Directory.FullName
          foreach ($name in @('FlClash.exe', 'FlClashCore.exe', 'FlClashHelperService.exe', 'flutter_windows.dll', 'manifest.json', 'data/icudtl.dat', 'data/app.so', 'data/flutter_assets')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $name))) { throw ('Incomplete native client: ' + $name) }
          }
          foreach ($name in @('FlClash.exe', 'FlClashCore.exe', 'FlClashHelperService.exe', 'flutter_windows.dll')) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $bundle $name))
            if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw ('Missing Windows PE header: ' + $name) }
          }
          $coreManifest = Get-Content (Join-Path $bundle 'manifest.json') -Raw | ConvertFrom-Json
          $coreHash = (Get-FileHash (Join-Path $bundle 'FlClashCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($coreHash -ne $coreManifest.coreSha256) { throw 'Core binary and Helper manifest do not match.' }
          Get-ChildItem $bundle -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Path, Hash | ConvertTo-Json -Depth 5 | Set-Content delivery/client-file-hashes.json
          Copy-Item build/source-manifest.json delivery/source-input.json
          [ordered]@{
            package = $packages[0].Name
            complete_client = $true
            core_sha256 = $coreHash
            native_windows_build = 'passed'
            gui_startup = 'not_performed'
            helper_scm_runtime = 'not_performed'
            wfp_runtime = 'not_performed'
            physical_dns_leak_acceptance = 'not_performed'
          } | ConvertTo-Json | Set-Content delivery/package-verification.json
      - name: Upload Windows client and build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.9.2-dns2-windows-amd64-native
          path: delivery/
          retention-days: 30
          if-no-files-found: warn
