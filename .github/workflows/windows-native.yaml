name: Build FlClash DNS2 Windows client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns2-native-windows
  cancel-in-progress: true

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  go-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./build/restore-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: source/FlClash-DNS/core/go.sum
      - name: Native Go tests
        timeout-minutes: 5
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          DNS2_TEST_DIAGNOSTIC_HOME: ${{ github.workspace }}/check-logs/core-diagnostics
        run: |
          & './build/invoke-ci-command.ps1' -Name go-test -Command go -WorkingDirectory source/FlClash-DNS/core -Arguments @('test', '-timeout', '120s', '.')
          & './build/invoke-ci-command.ps1' -Name go-diagnostic-lifetime -Command go -WorkingDirectory source/FlClash-DNS/core -Arguments @('test', '-timeout', '120s', '-count', '20', '-run', '^TestRejectedProtectedConfigDoesNotApplyDefault$', '.')
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns2-native-go-test-records
          path: check-logs/
  helper-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./build/restore-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Native Helper tests
        timeout-minutes: 8
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name helper-test -Command cargo -WorkingDirectory source/FlClash-DNS -Arguments @('test', '--locked', '--manifest-path', 'services/helper/Cargo.toml', '--features', 'windows-service', '--', '--test-threads=1')
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns2-native-helper-test-records
          path: check-logs/
  flutter-tests:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./build/restore-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Isolate Dart checks from the Go Helper build hook
        shell: pwsh
        run: |
          $path = 'source/FlClash-DNS/pubspec.yaml'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace("setup:`n      build_assets: true", "setup:`n      build_assets: false")
          if (-not $text.Contains("setup:`n      build_assets: false") -or -not $text.Contains("rust_api:`n      build_assets: true")) { throw 'Unexpected test hook settings.' }
          [IO.File]::WriteAllText($path, $text)
      - name: Initialize Flutter
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name flutter-bootstrap -Command flutter -WorkingDirectory source/FlClash-DNS -Arguments @('--version')
      - name: Resolve dependencies
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name pub-get -Command flutter -WorkingDirectory source/FlClash-DNS -Arguments @('pub', 'get')
      - name: Generate code
        timeout-minutes: 5
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name generation -Command dart -WorkingDirectory source/FlClash-DNS -Arguments @('run', 'build_runner', 'build', '--delete-conflicting-outputs')
      - name: Generate localization
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name localization -Command dart -WorkingDirectory source/FlClash-DNS -Arguments @('run', 'intl_utils:generate')
      - name: Analyze
        timeout-minutes: 5
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name analyze -Command flutter -WorkingDirectory source/FlClash-DNS -Arguments @('analyze', '--no-fatal-infos')
      - name: Native Flutter tests
        timeout-minutes: 15
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name flutter-test -Command flutter -WorkingDirectory source/FlClash-DNS -Arguments @(
            'test', '--reporter', 'expanded',
            'test/common/dns_protection_test.dart', 'test/common/dns_protection_log_test.dart',
            'test/common/dns_protection_probe_test.dart', 'test/common/http_test.dart',
            'test/core/controller_test.dart', 'test/core/service_test.dart', 'test/core/protocol_contract_test.dart',
            'test/core/desktop/helper_client_test.dart', 'test/providers/setup_action_test.dart',
            'test/manager/core_manager_test.dart', 'test/views/dns_protection_test.dart',
            'test/l10n', 'test/lint/dynamic_message_key_test.dart'
          )
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns2-native-flutter-test-records
          path: check-logs/
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./build/restore-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: source/FlClash-DNS/core/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Initialize Flutter
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name flutter-bootstrap -Command flutter -WorkingDirectory source/FlClash-DNS -LogDirectory delivery/build-logs -Arguments @('--version')
      - name: Resolve dependencies
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name pub-get -Command flutter -WorkingDirectory source/FlClash-DNS -LogDirectory delivery/build-logs -Arguments @('pub', 'get')
      - name: Verify native asset build hooks
        shell: pwsh
        run: |
          $text = Get-Content source/FlClash-DNS/pubspec.yaml -Raw
          if ($text -notmatch '(?ms)setup:\s+build_assets: true' -or $text -notmatch '(?ms)rust_api:\s+build_assets: true') { throw 'Native package must build every asset from source.' }
      - name: Build full native Windows package
        timeout-minutes: 35
        shell: pwsh
        run: |
          & './build/invoke-ci-command.ps1' -Name native-package -Command dart -WorkingDirectory source/FlClash-DNS -LogDirectory delivery/build-logs -Arguments @('run', 'setup.dart', 'windows', '--targets', 'zip', '--env', 'pre')
      - name: Verify complete runnable client
        shell: pwsh
        run: |
          & './build/collect-native-package.ps1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.9.2-dns2-windows-amd64-native
          path: delivery/
          retention-days: 30
          if-no-files-found: warn
