name: DNS protection Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  windows-client:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Build and validate with native Windows toolchains
        shell: pwsh
        run: ./tool/build_dns_windows.ps1 -OutputDirectory '${{ github.workspace }}/delivery'
      - name: Upload client and build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.9.2-dns2-windows-amd64-native
          path: delivery/
          retention-days: 14
